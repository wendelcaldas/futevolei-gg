<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>FUTEVOLEI.GG</title>
<style>:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--bs:clamp(64px,17vh,86px);--ink:#0b0f17;--glass:rgba(9,13,22,.66);--line:rgba(255,255,255,.14);--t0:#2f8bff;--t1:#ff4b3d;--gold:#ffc23a;--hot:#ff5d3a;--txt:#f6f3ee;--dim:rgba(246,243,238,.68);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;background:#0b0d12;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-webkit-text-size-adjust:100%;font-family:var(--font);color:var(--txt);-webkit-font-smoothing:antialiased;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#ui button{font-family:inherit;pointer-events:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.disp{font-style:italic;font-weight:900;letter-spacing:.01em;text-transform:uppercase}

/* ---------- MENU ---------- */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(12px + var(--st)) calc(clamp(24px,6vw,96px) + var(--sr)) calc(12px + var(--sb)) calc(clamp(24px,6vw,96px) + var(--sl));overflow-y:auto;touch-action:pan-y;pointer-events:auto;
  background:linear-gradient(90deg,rgba(6,9,16,.86) 0%,rgba(6,9,16,.62) 34%,rgba(6,9,16,0) 66%),linear-gradient(0deg,rgba(6,9,16,.5),rgba(6,9,16,0) 30%)}
.menu-col{width:min(440px,92vw);display:flex;flex-direction:column;gap:22px}
.logo{font-size:clamp(40px,6.4vw,84px);line-height:.9;font-style:italic;font-weight:900;letter-spacing:-.02em;margin:0;transform:skewX(-4deg);
  text-shadow:0 6px 30px rgba(0,0,0,.45)}
.logo b{background:linear-gradient(95deg,#ffd45a,#ff8a3a 45%,#ff3d77);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.tag{margin:8px 0 0;color:var(--dim);font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);padding:14px 20px;border-radius:12px;font-size:17px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:transform .12s,background .12s,border-color .12s;backdrop-filter:blur(8px)}
.btn:hover,.btn:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);transform:translateX(6px);outline:none}
.btn.primary{background:linear-gradient(95deg,#ffb23a,#ff5d3a 60%,#ff3d77);border-color:transparent;color:#1a0d06;font-size:21px;padding:17px 22px;box-shadow:0 10px 34px rgba(255,93,58,.38)}
.btn.primary:hover{filter:brightness(1.08)}
.btn small{font-weight:600;letter-spacing:.04em;opacity:.7;font-size:12px;text-transform:none}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:20px 22px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.panel h2{margin:0 0 14px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.opt:first-of-type{border-top:0}
.opt>span{font-size:14px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--dim);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:800;letter-spacing:.03em}
.seg button.on{background:#fff;color:#111722}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;align-items:center}
.keys kbd,.hint kbd,.prompt kbd{font-family:inherit;font-weight:800;font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:6px;padding:2px 7px;white-space:nowrap}
.keys span{color:var(--dim)}
.keys b{color:var(--txt)}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;margin:12px 0 0}
.back{margin-top:14px;align-self:flex-start;padding:10px 16px;font-size:13px}
.foot{position:absolute;left:calc(clamp(24px,6vw,96px) + var(--sl));bottom:calc(22px + var(--sb));font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.08em}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0}
.sb{position:absolute;left:calc(22px + var(--sl));top:calc(20px + var(--st));min-width:230px;border-radius:12px;overflow:hidden;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.sb-row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-bar{width:6px;align-self:stretch;margin:-8px 0}
.t0 .sb-bar{background:var(--t0)} .t1 .sb-bar{background:var(--t1)}
.sb-name{font-weight:800;letter-spacing:.1em;font-size:14px;flex:1}
.sb-name small{display:block;font-weight:600;font-size:10px;letter-spacing:.12em;color:var(--dim)}
.sb-serve{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);opacity:0}
.sb-row.serving .sb-serve{opacity:1}
.sb-score{font-size:28px;font-weight:900;font-style:italic;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.sb-score.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1.7);color:var(--gold)}100%{transform:scale(1)}}
.sb-foot{font-size:10px;letter-spacing:.16em;color:var(--dim);padding:6px 12px;text-transform:uppercase;font-weight:700}
.touches{position:absolute;top:calc(22px + var(--st));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:999px;backdrop-filter:blur(10px)}
.touches span{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--dim);margin-right:4px}
.touches i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .15s,transform .15s}
.touches.t0 i.on{background:var(--t0);box-shadow:0 0 12px var(--t0);transform:scale(1.15)}
.touches.t1 i.on{background:var(--t1);box-shadow:0 0 12px var(--t1);transform:scale(1.15)}
.callout{position:absolute;top:17%;left:0;right:0;text-align:center;font-size:clamp(26px,4.4vw,58px);opacity:0;text-shadow:0 4px 24px rgba(0,0,0,.55);pointer-events:none}
.callout.show{animation:pop 1.1s cubic-bezier(.2,.9,.2,1) forwards}
.callout.big{font-size:clamp(40px,7vw,96px);background:linear-gradient(95deg,#ffe27a,#ff8a3a 50%,#ff3d77);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(255,80,40,.5))}
.callout.t0c{color:#9cc8ff}.callout.t1c{color:#ffb0a8}
@keyframes pop{0%{opacity:0;transform:scale(.6) skewX(-8deg)}12%{opacity:1;transform:scale(1.12) skewX(-8deg)}22%{transform:scale(1) skewX(-8deg)}75%{opacity:1}100%{opacity:0;transform:scale(1.03) skewX(-8deg) translateY(-8px)}}
.timing{position:absolute;top:calc(17% + clamp(40px,6vw,80px));left:0;right:0;text-align:center;font-size:clamp(14px,1.6vw,20px);font-weight:900;letter-spacing:.2em;opacity:0}
.timing.show{animation:pop2 .9s forwards}
.timing.q3{color:#7dffb0}.timing.q2{color:#ffe27a}.timing.q1{color:#ff9d8a}
@keyframes pop2{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}
.banner{position:absolute;top:36%;left:0;right:0;text-align:center;opacity:0;pointer-events:none}
.banner.show{animation:ban 2.3s forwards}
.banner h3{margin:0;font-size:clamp(34px,6vw,84px);text-shadow:0 6px 30px rgba(0,0,0,.6)}
.banner p{margin:6px 0 0;font-size:clamp(13px,1.5vw,18px);letter-spacing:.3em;font-weight:800;color:var(--dim);text-transform:uppercase}
.banner.t0c h3{color:#8fc2ff}.banner.t1c h3{color:#ffa69c}
@keyframes ban{0%{opacity:0;transform:translateX(-40px) skewX(-8deg)}10%{opacity:1;transform:skewX(-8deg)}80%{opacity:1;transform:skewX(-8deg)}100%{opacity:0;transform:translateX(30px) skewX(-8deg)}}
.serve{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);width:min(440px,84vw);text-align:center}
.serve .bar{height:16px;border-radius:999px;background:rgba(9,13,22,.7);border:1px solid var(--line);position:relative;overflow:hidden}
.serve .zone{position:absolute;top:0;bottom:0;left:74%;width:15%;background:rgba(125,255,176,.35);border-left:1px solid #7dffb0;border-right:1px solid #7dffb0}
.serve .over{position:absolute;top:0;bottom:0;left:92%;right:0;background:rgba(255,75,61,.4)}
.serve .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,#ffd45a,#ff8a3a);border-radius:999px;opacity:.95}
.serve .serve-t{display:none}
.serve p{margin:10px 0 0;font-size:13px;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.7);letter-spacing:.02em}
.hint kbd{margin:0 3px 0 10px}
.prompt{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:12px;font-weight:900;letter-spacing:.1em;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.7);transition:opacity .15s}
.prompt .who{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--t0);color:#fff;font-size:10px;letter-spacing:.14em}
.prompt .act{margin-top:4px;font-size:12px}
.prompt.go .who{background:#22c873;box-shadow:0 0 16px #22c873}
.fade{position:absolute;inset:0;background:#05070b;opacity:0;pointer-events:none}
.msg{position:absolute;top:27%;left:0;right:0;text-align:center;font-size:13px;font-weight:800;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* ---------- TELAS ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.62);backdrop-filter:blur(6px);pointer-events:auto}
.screen .panel{width:min(480px,92vw);text-align:center}
.screen h1{margin:0 0 4px;font-size:clamp(34px,6vw,60px)}
.screen h1.win{background:linear-gradient(95deg,#ffe27a,#ff8a3a 50%,#ff3d77);-webkit-background-clip:text;background-clip:text;color:transparent}
.screen .final{font-size:54px;font-weight:900;font-style:italic;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.screen .final .a{color:#8fc2ff}.screen .final .b{color:#ffa69c}
.stats{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 18px}
.stats td,.stats th{padding:6px 8px;border-top:1px solid rgba(255,255,255,.08)}
.stats th{font-size:11px;letter-spacing:.14em;color:var(--dim);border-top:0}
.stats td:first-child,.stats th:first-child{text-align:right;width:28%;color:#8fc2ff;font-weight:800}
.stats td:last-child,.stats th:last-child{text-align:left;width:28%;color:#ffa69c;font-weight:800}
.stats td:nth-child(2){color:var(--dim);font-size:12px;letter-spacing:.08em}
.screen .btns{margin-top:6px}
.screen .btn{justify-content:center}
@media (max-height:560px){.menu-col{gap:12px}.tag{display:none}.hint{display:none}}

/* ---------- CONTROLES NA TELA (toque) ---------- */
.touch .hint{display:none}
.touch .serve .serve-k{display:none}.touch .serve .serve-t{display:block}
.touch .serve{bottom:auto;top:calc(64px + var(--st));width:min(340px,42vw)}
.touch .btn small{display:none}
.touch .btn:hover{transform:none}
.touch .msg{top:calc(70px + var(--st))}
.tc{position:absolute;inset:0;pointer-events:none}
.tc-zone{position:absolute;left:0;top:calc(96px + var(--st));bottom:0;width:48%;pointer-events:auto;touch-action:none}
.tc-stick{position:absolute;width:clamp(108px,30vh,136px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,255,255,.42);
  background:radial-gradient(circle,rgba(255,255,255,.05) 40%,rgba(255,255,255,.16));box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none;transition:opacity .15s}
.tc-stick.idle{left:calc(92px + var(--sl));top:auto;bottom:calc(18px + var(--sb));transform:translate(-50%,0);opacity:.5}
.tc-stick.sprint{border-color:#ffc23a;box-shadow:0 0 22px rgba(255,194,58,.55)}
.tc-knob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 3px 12px rgba(0,0,0,.35)}
.tc-btns{position:absolute;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));display:grid;grid-template-columns:repeat(3,var(--bs));gap:10px}
.tc-simple{position:absolute;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));display:flex;align-items:flex-end;gap:14px}
.tc-b{position:relative;width:var(--bs);height:var(--bs);border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(10,14,22,.46);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;pointer-events:auto;touch-action:none;backdrop-filter:blur(4px);
  transition:transform .06s,background .1s,box-shadow .15s;-webkit-user-select:none;user-select:none}
.tc-b::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.tc-b svg{width:38%;height:38%;pointer-events:none}
.tc-b span{font-size:clamp(8px,2.3vh,10.5px);font-weight:900;letter-spacing:0;pointer-events:none;line-height:1.1}
.tc-b small{font-size:clamp(8px,2.2vh,10px);font-weight:700;opacity:.8;letter-spacing:.02em;min-height:1em;pointer-events:none}
.tc-b.down{transform:scale(.92);background:rgba(255,255,255,.34)}
.tc-chapa{border-color:#ffb23a}.tc-shark{border-color:#ff5d3a}.tc-dominar{border-color:#6fb4ff}.tc-levantar{border-color:#7dffb0}
.tc-b.sug{background:rgba(47,139,255,.42);animation:tcpulse .7s ease-in-out infinite alternate}
.tc-b.sug.go{background:rgba(34,200,115,.6);border-color:#7dffb0;box-shadow:0 0 26px rgba(61,255,143,.75)}
.tc-b.charged{background:rgba(255,93,58,.7);border-color:#ffb23a;box-shadow:0 0 30px rgba(255,120,60,.8)}
@keyframes tcpulse{from{box-shadow:0 0 0 0 rgba(120,190,255,.0)}to{box-shadow:0 0 0 9px rgba(120,190,255,.32)}}
.tc-play{width:clamp(104px,31vh,136px);height:clamp(104px,31vh,136px);border-width:3px;border-color:#ffc23a;background:rgba(10,14,22,.5)}
.tc-play svg{width:30%;height:30%}
.tc-play span{font-size:clamp(12px,3.6vh,16px)}
.tc-pause{position:absolute;top:calc(14px + var(--st));right:calc(14px + var(--sr));width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:#fff;
  display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;backdrop-filter:blur(8px);padding:0}
.tc-pause svg{width:22px;height:22px}
.rotate{position:absolute;inset:0;z-index:50;background:rgba(6,9,16,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;pointer-events:auto}
.rotate h2{margin:14px 0 0;font-size:30px}
.rotate p{margin:0 0 14px;color:var(--dim);font-size:15px;max-width:280px;line-height:1.45}
.rotate .btn{justify-content:center;min-width:200px}
.rot-ic{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.rot-ic i{display:block;width:52px;height:92px;border:4px solid #fff;border-radius:12px;position:relative;animation:rot 2.4s ease-in-out infinite}
.rot-ic i::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#fff}
@keyframes rot{0%,20%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}

/* ---------- TELAS BAIXAS (celular em paisagem) ---------- */
@media (max-height:500px){
  .menu{justify-content:flex-start;background:linear-gradient(90deg,rgba(6,9,16,.9) 0%,rgba(6,9,16,.66) 46%,rgba(6,9,16,0) 82%)}
  .menu-col{gap:10px;width:min(430px,94vw);margin:auto 0}
  .logo{font-size:clamp(30px,11vh,46px)}
  .tag{display:none}
  .btns{gap:8px;margin-top:2px}
  .menu .btns{display:grid;grid-template-columns:1fr 1fr}
  .menu .btns .primary{grid-column:1 / -1}
  .btn{padding:12px 14px;font-size:14px;min-height:46px}
  .btn.primary{font-size:17px;padding:13px 16px}
  .menu .btn small{display:none}
  .menu.sub .menu-col{width:min(640px,96vw)}
  .menu.sub .logo{display:none}
  .panel{padding:12px 14px;border-radius:14px}
  .panel h2{margin:0 0 6px;font-size:12px}
  .panel .opt{padding:5px 0}
  .pOpts{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
  .pOpts .opt:nth-child(2){border-top:0}
  .seg button{padding:9px 11px;min-height:38px}
  .keys{font-size:12.5px;gap:5px 12px}
  .note{font-size:11.5px;margin-top:8px;line-height:1.4}
  .back{margin-top:8px;min-height:42px}
  .foot{display:none}
  .sb{min-width:176px;border-radius:10px}
  .sb-row{padding:4px 10px 4px 0;gap:8px}.sb-bar{margin:-4px 0}
  .sb-name{font-size:12px}.sb-name small{font-size:8.5px}
  .sb-score{font-size:21px;min-width:28px}
  .sb-foot{display:none}
  .touches{padding:6px 11px}.touches i{width:11px;height:11px}
  .callout{top:19%}
  .banner{top:30%}
  .screen .panel{width:min(520px,94vw);max-height:calc(100% - 16px);overflow-y:auto;touch-action:pan-y}
  .screen h1{font-size:30px;margin:0}
  .screen .final{font-size:34px;margin:0 0 6px}
  .stats{font-size:12.5px;margin:2px 0 10px}
  .stats td,.stats th{padding:3px 8px}
  .screen .btns{flex-direction:row;display:flex}
  .screen .btns .btn{flex:1;font-size:13px;padding:10px 8px;letter-spacing:.04em}
  .screen .note{display:none}
}
@media (max-width:700px) and (max-height:500px){
  .pOpts{grid-template-columns:1fr}
  .pOpts .opt:nth-child(2){border-top:1px solid rgba(255,255,255,.07)}
  .opt>span{font-size:12.5px}
  .sb{min-width:150px}
}
@media (max-width:560px){
  .opt{flex-wrap:wrap}
}

/* ---------- MULTIPLAYER LOCAL ---------- */
.btn.nav,.seg button.nav,.lb-chip.nav{outline:3px solid #ffc23a;outline-offset:2px}
.btn.nav{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}
.btn.primary.nav{filter:brightness(1.1)}
.menu.wide .menu-col{width:min(1080px,96vw)}
.menu.wide .logo{font-size:clamp(28px,3.4vw,44px)}
.menu.wide .tag{display:none}
.ctl-grid{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:18px 26px;align-items:start}
.ctl-col h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.ctl-col h3 small{display:block;font-size:10.5px;letter-spacing:.04em;color:var(--dim);font-weight:600;text-transform:none;margin-top:2px}
.ctl-col .keys{font-size:13px}
.padsvg{width:100%;max-width:400px;height:auto;color:#f6f3ee;display:block}
@media (max-width:900px){.ctl-grid{grid-template-columns:1fr 1fr}.ctl-pad{grid-column:1 / -1}}
@media (max-width:560px){.ctl-grid{grid-template-columns:1fr}}
.prompt .who{transition:background .12s}
.sb-sub b{font-weight:900;padding:0 4px;border-radius:4px;color:#0b0f17;font-size:9.5px;letter-spacing:.04em}
.serve.custom .serve-k,.serve.custom .serve-t{display:none!important}
.serve .serve-m{display:block}
.serve .serve-m.hidden{display:none}
.serve .serve-m b{padding:1px 6px;border-radius:5px;color:#0b0f17}
.notice{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:rgba(255,93,58,.16);border:1px solid rgba(255,93,58,.5);font-size:14px;font-weight:700;line-height:1.4}
.screen .panel.wide{width:min(640px,94vw)}
.screen h1.tw0{color:#8fc2ff}.screen h1.tw1{color:#ffa69c}
.pstats{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 16px}
.pstats th{font-size:9.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;padding:4px 4px}
.pstats td{padding:5px 4px;border-top:1px solid rgba(255,255,255,.08);font-weight:700;font-variant-numeric:tabular-nums}
.pstats .tm0{color:#8fc2ff}.pstats .tm1{color:#ffa69c}
.ptag{display:inline-block;padding:2px 8px;border-radius:999px;color:#0b0f17;font-size:11px;font-weight:900;letter-spacing:.06em}
.lobby{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:calc(20px + var(--st)) calc(clamp(16px,4vw,56px) + var(--sr)) calc(18px + var(--sb)) calc(clamp(16px,4vw,56px) + var(--sl));
  background:rgba(5,8,14,.74);backdrop-filter:blur(8px);pointer-events:auto;overflow-y:auto}
.lb-head h1{margin:0;font-size:clamp(28px,4.4vw,52px)}
.lb-head p{margin:6px 0 0;color:var(--dim);font-size:14px}
.lb-head p b{color:var(--txt)}
.lb-cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;min-height:0}
.lb-team,.lb-mid{border-radius:16px;border:1px solid var(--line);background:var(--glass);padding:14px;display:flex;flex-direction:column;gap:10px}
.lb-team.t0{border-color:rgba(47,139,255,.7);box-shadow:inset 0 0 0 1px rgba(47,139,255,.25),0 0 40px rgba(47,139,255,.12)}
.lb-team.t1{border-color:rgba(255,75,61,.7);box-shadow:inset 0 0 0 1px rgba(255,75,61,.25),0 0 40px rgba(255,75,61,.12)}
.lobby h2{margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.lb-team.t0 h2{color:#8fc2ff}.lb-team.t1 h2{color:#ffa69c}.lb-mid h2{color:var(--dim)}
.lobby h2 small{font-size:10px;opacity:.8}
.lb-slots,.lb-devs{display:flex;flex-direction:column;gap:8px}
.lb-chip{appearance:none;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;width:100%;padding:9px 12px;border-radius:12px;
  border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--dim);min-height:58px}
.lb-chip i{grid-row:1 / 3;width:44px;height:33px;display:block}
.lb-chip i svg{width:100%;height:100%}
.lb-chip .lb-n{font-size:14px;font-weight:800;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.lb-chip .lb-n b{background:var(--pc);color:#0b0f17;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:900}
.lb-chip small{font-size:11.5px;font-weight:600;opacity:.85}
.lb-chip.on{border-color:var(--pc);color:var(--txt);background:rgba(255,255,255,.09)}
.lb-chip.on i{color:var(--pc)}
.lb-chip.ready{background:color-mix(in srgb,var(--pc) 26%,transparent)}
.lb-chip.ready small{color:#7dffb0;font-weight:900;letter-spacing:.14em}
.lb-cpu{min-height:58px;border-radius:12px;border:2px dashed rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.3em;color:rgba(255,255,255,.34);font-size:13px}
.lb-tip{margin:4px 0 0;font-size:12px;color:var(--dim);line-height:1.45}
.lb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lb-status{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--gold)}
.lb-btns{display:flex;gap:10px}
.lb-btns .btn{margin:0;padding:12px 22px;font-size:15px}
.lb-btns .btn.dim{opacity:.45}
@media (max-height:560px){.lobby{gap:8px}.lb-head p{display:none}.lb-chip{min-height:46px;padding:5px 10px}.lb-cpu{min-height:46px}.lb-team,.lb-mid{padding:10px}}
